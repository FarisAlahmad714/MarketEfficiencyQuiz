{% extends "base.html" %}

{% block content %}
<div class="quiz-container">
    <div class="quiz-header">
        <h1>Choose Your Bias Test</h1>
        <p>Select a test type to challenge your market bias prediction skills.</p>
    </div>
    <div class="test-options">
        <div class="test-card">
            <h2>Random Daily Bias</h2>
            <p>Mixed market conditions and scenarios</p>
            <a href="{{ url_for('daily_bias', test_type='random') }}" class="start-btn">Start Test</a>
        </div>
        <div class="test-card">
            <h2>BTC 2024 Q1-Q3</h2>
            <p>Focused Bitcoin price action</p>
            <a href="{{ url_for('daily_bias', test_type='btc') }}" class="start-btn">Start Test</a>
        </div>
    </div>
</div>
{% endblock %}
