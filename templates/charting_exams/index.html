<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charting Exams</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Charting Exams</h1>
        <div class="exam-grid">
            {% for exam_type, info in exam_descriptions.items() %}
            <div class="exam-card">
                <h2>{{ info.title }}</h2>
                <p>{{ info.description }}</p>
                <div class="tools-required">
                    <h3>Tools:</h3>
                    <ul>
                        {% for tool in info.tools_required %}
                        <li>{{ tool|title }}</li>
                        {% endfor %}
                    </ul>
                </div>
                <a href="{{ url_for('charting_exam_intro', exam_type=exam_type) }}" 
                   class="start-btn">Start Exam</a>
            </div>
            {% endfor %}
        </div>
        <a href="{{ url_for('index') }}" class="back-btn">Return to Main Menu</a>
    </div>
</body>
</html>
