<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Trading Quiz{% endblock %}</title>
<!-- In base.html, change the script import to -->
<script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>   <!-- Bootstrap for Better Styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Trading Quiz</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('bias_test_selection') }}">Bias Test</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('quiz', topic='Swing Point Basics', question_id=0) }}">Quiz</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('charting_exams') }}">Charting Exams</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3 mt-5">
        © 2024 Trading Quiz - All Rights Reserved.
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Fabric.js for drawing features -->
    {% if request.endpoint and 'charting_exam' in request.endpoint %}
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    {% endif %}

    {% block extra_js %}{% endblock %}
    
    <!-- Existing magnifier script -->
    <script>
        function openMagnifier(img) {
            var modal = document.getElementById("magnifierModal");
            var modalImg = document.getElementById("magnifiedImage");
        
            modal.style.display = "flex";
            modalImg.src = img.src;
        }
        
        function closeMagnifier() {
            document.getElementById("magnifierModal").style.display = "none";
        }
    </script>
</body>
</html>
