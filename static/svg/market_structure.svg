<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#1a1a1a" />
  
  <!-- Grid lines -->
  <g stroke="#333" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
  </g>

  <!-- Price chart (candlesticks) -->
  <g>
    <!-- Candles -->
    <rect x="50" y="450" width="20" height="50" fill="#4CAF50" />
    <rect x="80" y="420" width="20" height="60" fill="#4CAF50" />
    <rect x="110" y="380" width="20" height="70" fill="#4CAF50" />
    <rect x="140" y="350" width="20" height="60" fill="#4CAF50" />
    <rect x="170" y="320" width="20" height="70" fill="#4CAF50" />
    <rect x="200" y="280" width="20" height="80" fill="#4CAF50" />
    <rect x="230" y="330" width="20" height="90" fill="#F44336" />
    <rect x="260" y="370" width="20" height="60" fill="#F44336" />
    <rect x="290" y="350" width="20" height="50" fill="#4CAF50" />
    <rect x="320" y="320" width="20" height="60" fill="#4CAF50" />
    <rect x="350" y="280" width="20" height="70" fill="#4CAF50" />
    <rect x="380" y="250" width="20" height="60" fill="#4CAF50" />
    <rect x="410" y="220" width="20" height="70" fill="#4CAF50" />
    <rect x="440" y="270" width="20" height="90" fill="#F44336" />
    <rect x="470" y="310" width="20" height="60" fill="#F44336" />
    <rect x="500" y="350" width="20" height="70" fill="#F44336" />
    <rect x="530" y="380" width="20" height="50" fill="#F44336" />
    <rect x="560" y="340" width="20" height="60" fill="#4CAF50" />
    <rect x="590" y="310" width="20" height="70" fill="#4CAF50" />
    <rect x="620" y="280" width="20" height="60" fill="#4CAF50" />
    <rect x="650" y="250" width="20" height="70" fill="#4CAF50" />
    <rect x="680" y="220" width="20" height="60" fill="#4CAF50" />
    <rect x="710" y="200" width="20" height="50" fill="#4CAF50" />
  </g>
  
  <!-- Swing highs -->
  <circle cx="230" cy="280" r="8" fill="#F44336" />
  <circle cx="440" cy="220" r="8" fill="#F44336" />
  <text x="230" y="260" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">SH</text>
  <text x="440" y="200" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">SH</text>
  
  <!-- Swing lows -->
  <circle cx="50" cy="500" r="8" fill="#4CAF50" />
  <circle cx="290" cy="400" r="8" fill="#4CAF50" />
  <circle cx="530" cy="430" r="8" fill="#4CAF50" />
  <text x="50" y="520" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">SL</text>
  <text x="290" y="420" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">SL</text>
  <text x="530" y="450" fill="#ffffff" font-family="Arial" font-size="14" text-anchor="middle">SL</text>
  
  <!-- Equal highs -->
  <line x1="200" y1="280" x2="380" y2="280" stroke="#FF9800" stroke-width="2" stroke-dasharray="5,5" />
  <text x="290" y="275" fill="#FF9800" font-family="Arial" font-size="14" text-anchor="middle">Equal High</text>
  
  <!-- Equal lows -->
  <line x1="500" y1="420" x2="620" y2="420" stroke="#2196F3" stroke-width="2" stroke-dasharray="5,5" />
  <text x="560" y="440" fill="#2196F3" font-family="Arial" font-size="14" text-anchor="middle">Equal Low</text>
  
  <!-- Market structure zones -->
  <rect x="140" y="200" width="150" height="50" fill="rgba(244, 67, 54, 0.3)" stroke="#F44336" stroke-width="2" rx="5" ry="5" />
  <text x="215" y="230" fill="#ffffff" font-family="Arial" font-size="16" text-anchor="middle">Resistance Zone</text>
  
  <rect x="350" y="150" width="150" height="50" fill="rgba(244, 67, 54, 0.3)" stroke="#F44336" stroke-width="2" rx="5" ry="5" />
  <text x="425" y="180" fill="#ffffff" font-family="Arial" font-size="16" text-anchor="middle">Resistance Zone</text>
  
  <rect x="490" y="450" width="150" height="50" fill="rgba(76, 175, 80, 0.3)" stroke="#4CAF50" stroke-width="2" rx="5" ry="5" />
  <text x="565" y="480" fill="#ffffff" font-family="Arial" font-size="16" text-anchor="middle">Support Zone</text>
  
  <!-- Trend lines -->
  <line x1="50" y1="500" x2="710" y2="200" stroke="#2196F3" stroke-width="3" />
  <path d="M 50 500 Q 290 250, 710 200" stroke="#9C27B0" stroke-width="2" fill="none" stroke-dasharray="10,10" />
  
  <!-- Title -->
  <text x="400" y="40" fill="#ffffff" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Market Structure Analysis</text>
  
  <!-- Labels -->
  <text x="120" y="80" fill="#ffffff" font-family="Arial" font-size="18">Uptrend</text>
  <text x="350" y="80" fill="#ffffff" font-family="Arial" font-size="18">Higher Highs</text>
  <text x="580" y="80" fill="#ffffff" font-family="Arial" font-size="18">Higher Lows</text>
</svg>