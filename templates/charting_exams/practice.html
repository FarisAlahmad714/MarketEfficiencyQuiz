{% extends "base.html" %}
{% block title %}Charting Exam Practice{% endblock %}
{% block header %}{{ exam_type|capitalize }} Practice{% endblock %}
{% block content %}

<div class="container">
   <h2>{{ section|capitalize }} Analysis</h2>
   <p>{{ instructions }}</p>
   
   <h3 id="chart-symbol">Symbol: Loading...</h3>
   <div id="chart-container" style="position: relative; width: 800px; height: 600px; background-color: white;"></div>    
   <div class="toolbar mt-3">
       <button id="line-tool" class="btn btn-primary">Line</button>
       <button id="pointer-tool" class="btn btn-primary">Pointer</button>
       <button id="clear-btn" class="btn btn-secondary">Clear</button>
       <button id="undo-btn" class="btn btn-secondary">Undo</button>
       <button id="submit-btn" class="btn btn-success">Submit Answer</button>
   </div>

   <div class="modal fade" id="feedbackModal" tabindex="-1">
       <div class="modal-dialog">
           <div class="modal-content">
               <div class="modal-header">
                   <h5 class="modal-title">Results</h5>
                   <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
               </div>
               <div class="modal-body" id="feedbackContent"></div>
               <div class="modal-footer">
                   <button type="button" class="btn btn-primary" data-bs-dismiss="modal" id="continue-btn">Continue</button>
               </div>
           </div>
       </div>
   </div>
</div>

<script>
   let chartCount = {{ progress.chart_count|default(1) }};
   const maxCharts = 5;
   document.getElementById('chart-symbol').textContent = `Symbol: {{ symbol|default('Unknown') }}`;

   class DrawingLayer {
       constructor(chartContainer, chart, series, chartData) {
           this.container = chartContainer;
           this.chart = chart;
           this.series = series;
           this.chartData = chartData;
           this.svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
           this.svg.style.position = "absolute";
           this.svg.style.top = "0";
           this.svg.style.left = "0";
           this.svg.style.width = "100%";
           this.svg.style.height = "100%";
           this.svg.style.pointerEvents = "none";
           this.svg.style.zIndex = "5";
           chartContainer.appendChild(this.svg);

           this.currentTool = null;
           this.isDrawing = false;
           this.currentElement = null;
           this.drawings = [];
           this.chartHeight = chartContainer.clientHeight;
           this.chartWidth = chartContainer.clientWidth;

           this.container.addEventListener('mousedown', this.startDrawing.bind(this));
           this.container.addEventListener('mousemove', this.handleMouseMove.bind(this));
           this.container.addEventListener('mouseup', this.endDrawing.bind(this));

           if (this.chartData.length > 0 && 'symbol' in this.chartData[0]) {
               document.getElementById('chart-symbol').textContent = `Symbol: ${this.chartData[0].symbol}`;
           }
       }

       getChartCoordinates(pixelX, pixelY) {
           try {
               if (!this.chartData || this.chartData.length === 0) throw new Error('Chart data not available');
               const timeScale = this.chart.timeScale();
               const visibleLogicalRange = timeScale.getVisibleLogicalRange();
               const logicalX = timeScale.coordinateToLogical(pixelX);
               const timeFraction = (logicalX - visibleLogicalRange.from) / (visibleLogicalRange.to - visibleLogicalRange.from);
               const timeRange = { from: this.chartData[0].time, to: this.chartData[this.chartData.length - 1].time };
               let time = timeRange.from + timeFraction * (timeRange.to - timeRange.from);

               const closestCandle = this.chartData.reduce((closest, data) => {
                   const diff = Math.abs(data.time - time);
                   return diff < Math.abs(closest.time - time) ? data : closest;
               }, this.chartData[0]);
               time = closestCandle.time;

               let price = this.series.coordinateToPrice(pixelY);
               if (price === null) {
                   const prices = this.chartData.map(d => [d.low, d.high]).flat();
                   const minPrice = Math.min(...prices);
                   const maxPrice = Math.max(...prices);
                   const priceFraction = 1 - (pixelY / this.chartHeight);
                   price = minPrice + (priceFraction * (maxPrice - minPrice));
               }
               const finalPrice = [closestCandle.low, closestCandle.high].reduce((closest, p) => {
                   const diff = Math.abs(p - price);
                   return diff < Math.abs(closest - price) ? p : closest;
               }, price);

               console.log('Pixel coordinates:', { x: pixelX, y: pixelY });
               console.log('Chart values:', { time, price: finalPrice });
               return { time, price: finalPrice };
           } catch (error) {
               console.error('Error in getChartCoordinates:', error.message);
               return { time: null, price: null };
           }
       }

       setTool(tool) {
           this.currentTool = tool;
           console.log('Tool selected:', tool);
           if (tool === 'line' || tool === 'pointer') {
               this.svg.style.pointerEvents = "auto";
               this.container.style.cursor = tool === 'line' ? 'crosshair' : 'pointer';
           } else {
               this.svg.style.pointerEvents = "none";
               this.container.style.cursor = 'default';
           }
       }

       handleMouseMove(e) { if (this.isDrawing && this.currentTool === 'line') this.draw(e); }

       startDrawing(e) {
           if (!this.currentTool) return;
           this.isDrawing = true;
           const point = this.getMousePosition(e);
           console.log('Started drawing at:', point);
           if (this.currentTool === 'line') {
               this.currentElement = this.createLine(point.x, point.y, point.x, point.y);
               this.svg.appendChild(this.currentElement);
           } else if (this.currentTool === 'pointer') {
               const circle = this.createPoint(point.x, point.y);
               this.svg.appendChild(circle);
               this.drawings.push(circle);
           }
       }

       draw(e) {
           if (!this.isDrawing || this.currentTool !== 'line') return;
           const point = this.getMousePosition(e);
           this.currentElement.setAttribute('x2', point.x);
           this.currentElement.setAttribute('y2', point.y);
           const end = this.getChartCoordinates(point.x, point.y);
           this.currentElement.dataset.endTime = end.time;
           this.currentElement.dataset.endPrice = end.price;
           console.log('Drawing at:', point);
       }

       endDrawing(e) {
           if (!this.isDrawing) return;
           if (this.currentTool === 'line' && this.currentElement) this.drawings.push(this.currentElement);
           this.isDrawing = false;
           this.currentElement = null;
           console.log('Finished drawing');
       }

       createPoint(x, y) {
           const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
           const { time, price } = this.getChartCoordinates(x, y);
           circle.setAttribute('cx', x);
           circle.setAttribute('cy', y);
           circle.setAttribute('r', '5');
           circle.setAttribute('fill', 'blue');
           circle.dataset.time = time;
           circle.dataset.price = price;
           return circle;
       }

       createLine(x1, y1, x2, y2) {
           const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
           const start = this.getChartCoordinates(x1, y1);
           const end = this.getChartCoordinates(x2, y2);
           line.setAttribute('x1', x1);
           line.setAttribute('y1', y1);
           line.setAttribute('x2', x2);
           line.setAttribute('y2', y2);
           line.setAttribute('stroke', 'red');
           line.setAttribute('stroke-width', '2');
           line.dataset.startTime = start.time;
           line.dataset.startPrice = start.price;
           line.dataset.endTime = end.time;
           line.dataset.endPrice = end.price;
           return line;
       }

       getMousePosition(event) {
           const rect = this.container.getBoundingClientRect();
           return { x: event.clientX - rect.left, y: event.clientY - rect.top };
       }

       clearDrawings() {
           while (this.svg.firstChild) this.svg.removeChild(this.svg.firstChild);
           this.drawings = [];
           this.setTool(null);
       }

       undoLastDrawing() { if (this.drawings.length > 0) this.svg.removeChild(this.drawings.pop()); }

       updateChartData(newData) {
           this.chartData = newData;
           this.series.setData(newData);
           this.chart.timeScale().fitContent();
           this.clearDrawings();
       }
   }

   const container = document.getElementById('chart-container');
   const { createChart, CrosshairMode } = LightweightCharts;
   const chart = createChart(container, {
       width: 800, height: 600,
       layout: { background: { color: '#ffffff' }, textColor: '#333333' },
       rightPriceScale: { visible: true, borderVisible: true },
       timeScale: { visible: true, borderVisible: true },
       crosshair: { mode: CrosshairMode.Normal, vertLine: { visible: true, labelVisible: true }, horzLine: { visible: true, labelVisible: true } },
       handleScroll: { mouseWheel: true, pressedMouseMove: true },
       handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true }
   });
   const candlestickSeries = chart.addCandlestickSeries();
   const chartData = {{ chart_data|tojson|safe }};
   candlestickSeries.setData(chartData);
   chart.timeScale().fitContent();

   const drawingLayer = new DrawingLayer(container, chart, candlestickSeries, chartData);

   document.getElementById('line-tool').addEventListener('click', () => drawingLayer.setTool('line'));
   document.getElementById('pointer-tool').addEventListener('click', () => drawingLayer.setTool('pointer'));
   document.getElementById('clear-btn').addEventListener('click', () => drawingLayer.clearDrawings());
   document.getElementById('undo-btn').addEventListener('click', () => drawingLayer.undoLastDrawing());

   function detectSwingPoints(data, lookback = 3) {
       const swingPoints = { highs: [], lows: [] };
       for (let i = lookback; i < data.length - lookback; i++) {
           const current = data[i];
           const before = data.slice(i - lookback, i).map(c => c.high);
           const after = data.slice(i + 1, i + 1 + lookback).map(c => c.high);
           if (current.high > Math.max(...before) && current.high > Math.max(...after)) {
               swingPoints.highs.push({ time: current.time, price: current.high });
           }
           const beforeLows = data.slice(i - lookback, i).map(c => c.low);
           const afterLows = data.slice(i + 1, i + 1 + lookback).map(c => c.low);
           if (current.low < Math.min(...beforeLows) && current.low < Math.min(...afterLows)) {
               swingPoints.lows.push({ time: current.time, price: current.low });
           }
       }
       console.log('Detected swing points:', swingPoints);
       return swingPoints;
   }

   function submitAnswer() {
       const userPoints = drawingLayer.drawings
           .filter(el => el.tagName === 'circle')
           .map(circle => ({
               time: parseFloat(circle.dataset.time),
               price: parseFloat(circle.dataset.price),
               type: determinatePointType(parseFloat(circle.dataset.time), parseFloat(circle.dataset.price), drawingLayer.chartData)
           }))
           .filter(point => point.type !== null);

       console.log('User points:', userPoints);
       const expectedPoints = detectSwingPoints(drawingLayer.chartData);
       const tolerance = 0.002;
       let score = 0;
       const feedback = { correct: [], missed: [], incorrect: [] };

       userPoints.forEach(point => {
           const expected = point.type === 'high' ? expectedPoints.highs : expectedPoints.lows;
           const match = expected.some(exp => {
               const diff = Math.abs(exp.price - point.price) / exp.price;
               console.log(`Checking ${point.type} at ${point.price} vs expected ${exp.price}, diff: ${diff}`);
               return diff <= tolerance;
           });
           if (match) {
               score++;
               feedback.correct.push(point);
           } else {
               feedback.incorrect.push(point);
           }
       });

       expectedPoints.highs.forEach(point => {
           if (!userPoints.some(userPoint => Math.abs(userPoint.price - point.price) / userPoint.price <= tolerance)) {
               feedback.missed.push({...point, type: 'high'});
           }
       });

       expectedPoints.lows.forEach(point => {
           if (!userPoints.some(userPoint => Math.abs(userPoint.price - point.price) / userPoint.price <= tolerance)) {
               feedback.missed.push({...point, type: 'low'});
           }
       });

       const totalExpectedPoints = (expectedPoints.highs?.length || 0) + (expectedPoints.lows?.length || 0);
       fetch('/charting_exam/validate', {
           method: 'POST',
           headers: { 'Content-Type': 'application/json' },
           body: JSON.stringify({ 
               examType: '{{ exam_type }}', 
               drawings: userPoints,
               feedback: feedback,
               score: score,
               totalExpectedPoints: totalExpectedPoints
           })
       })
       .then(response => {
           if (!response.ok) throw new Error('Network response was not ok');
           return response.json();
       })
       .then(data => {
           console.log('Validation response:', data);
           chartCount = data.chart_count;  // Sync with server
           if (data.success !== undefined) {
               const feedbackHtml = `
                   <div class="feedback-summary bg-light p-3 rounded" style="color: #333333;">
                       <h4 class="mb-3">Analysis Results - Chart ${chartCount}/${maxCharts}</h4>
                       <div class="score-section mb-3">
                           <h5>Score: ${data.score || 0}/${data.totalExpectedPoints || 0}</h5>
                           <p class="accuracy mb-2">Accuracy: ${data.totalExpectedPoints ? ((data.score / data.totalExpectedPoints) * 100).toFixed(1) : 0}%</p>
                           <p>Found ${expectedPoints.highs.length + expectedPoints.lows.length} swing points</p>
                       </div>
                       
                       ${data.feedback.correct.length > 0 ? `
                           <div class="correct-points mb-3">
                               <h5 class="text-success">✓ Correct Points</h5>
                               <ul class="list-unstyled">
                                   ${data.feedback.correct.map(point => `
                                       <li><strong>${point.type.toUpperCase()}</strong>: ${point.price.toFixed(2)}</li>
                                   `).join('')}
                               </ul>
                           </div>
                       ` : ''}
                       
                       ${data.feedback.incorrect.length > 0 ? `
                           <div class="incorrect-points mb-3">
                               <h5 class="text-danger">✗ Incorrect Points</h5>
                               <ul class="list-unstyled">
                                   ${data.feedback.incorrect.map(point => `
                                       <li><strong>${point.type.toUpperCase()}</strong>: ${point.price.toFixed(2)}</li>
                                   `).join('')}
                               </ul>
                           </div>
                       ` : ''}
                       
                       ${data.feedback.missed.length > 0 ? `
                           <div class="missed-points mb-3">
                               <h5 class="text-warning">! Missed Points</h5>
                               <ul class="list-unstyled">
                                   ${data.feedback.missed.map(point => `
                                       <li><strong>${point.type.toUpperCase()}</strong>: ${point.price.toFixed(2)}</li>
                                   `).join('')}
                               </ul>
                           </div>
                       ` : ''}
                   </div>
               `;
               document.getElementById('feedbackContent').innerHTML = feedbackHtml;
               document.getElementById('chart-symbol').textContent = `Symbol: ${data.symbol || 'Unknown'}`;
               const feedbackModal = new bootstrap.Modal(document.getElementById('feedbackModal'));
               feedbackModal.show();

               document.getElementById('continue-btn').addEventListener('click', () => {
                   document.getElementById('pointer-tool').focus();
                   console.log('Current chartCount before continue:', chartCount);
                   if (chartCount < maxCharts) {
                       fetch('/fetch_new_chart')
                           .then(response => {
                               if (!response.ok) throw new Error(`Fetch failed: ${response.status}`);
                               return response.json();
                           })
                           .then(data => {
                               console.log('New chart response:', data);
                               if (data.chart_data) {
                                   drawingLayer.updateChartData(data.chart_data);
                                   chartCount = data.chart_count;  // Sync with server
                                   drawingLayer.setTool('pointer');
                                   document.getElementById('chart-symbol').textContent = `Symbol: ${data.symbol || 'Unknown'}`;
                                   feedbackModal.hide();
                                   // Reattach submit listener after successful progression
                                   document.getElementById('submit-btn').removeEventListener('click', submitAnswer);
                                   document.getElementById('submit-btn').addEventListener('click', submitAnswer);
                               } else {
                                   throw new Error('No chart_data in response');
                               }
                           })
                           .catch(error => {
                               console.error('Error fetching new chart:', error);
                               document.getElementById('feedbackContent').innerHTML = `
                                   <div class="feedback-summary" style="color: #333333;">
                                       <h4>Error</h4>
                                       <p>Failed to load new chart: ${error.message}</p>
                                   </div>
                               `;
                               feedbackModal.show();
                           });
                   } else {
                       document.getElementById('feedbackContent').innerHTML = `
                           <div class="feedback-summary" style="color: #333333;">
                               <h4>Exam Complete!</h4>
                               <p>You've finished all ${maxCharts} charts. Great job!</p>
                               <button id="restart-btn" class="btn btn-primary mt-3">Start New Quiz</button>
                           </div>
                       `;
                       document.getElementById('continue-btn').style.display = 'none';
                       feedbackModal.show();

                       document.getElementById('restart-btn').addEventListener('click', () => {
                           chartCount = 1;  // Reset to 1
                           fetch('/fetch_new_chart')
                               .then(response => response.json())
                               .then(data => {
                                   drawingLayer.updateChartData(data.chart_data);
                                   chartCount = data.chart_count;
                                   drawingLayer.setTool('pointer');
                                   document.getElementById('chart-symbol').textContent = `Symbol: ${data.symbol || 'Unknown'}`;
                                   feedbackModal.hide();
                                   document.getElementById('continue-btn').style.display = 'block';
                                   // Reattach submit listener after restart
                                   document.getElementById('submit-btn').removeEventListener('click', submitAnswer);
                                   document.getElementById('submit-btn').addEventListener('click', submitAnswer);
                               })
                               .catch(error => console.error('Restart error:', error));
                       });
                   }
               }, { once: true });
           }
       })
       .catch(error => {
           console.error('Error validating drawing:', error);
           document.getElementById('feedbackContent').innerHTML = `
               <div class="feedback-summary" style="color: #333333;">
                   <h4>Error</h4>
                   <p>Failed to validate drawing: ${error.message}</p>
               </div>
           `;
           const feedbackModal = new bootstrap.Modal(document.getElementById('feedbackModal'));
           feedbackModal.show();
       });

       drawingLayer.setTool(null);
   }

   // Initial attachment of submit listener
   document.getElementById('submit-btn').addEventListener('click', submitAnswer);

   function determinatePointType(time, price, chartData) {
       const candle = chartData.find(c => c.time === time);
       if (!candle) return null;
       return Math.abs(price - candle.high) < Math.abs(price - candle.low) ? 'high' : 'low';
   }
</script>

{% endblock %}
