<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background -->
  <rect width="800" height="600" fill="#1a1a1a" />
  
  <!-- Grid lines -->
  <g stroke="#333" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
    
    <line x1="100" y1="0" x2="100" y2="600" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="300" y1="0" x2="300" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="500" y1="0" x2="500" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
    <line x1="700" y1="0" x2="700" y2="600" />
  </g>

  <!-- Price chart (candlesticks) -->
  <g>
    <!-- Candles before gap -->
    <rect x="50" y="350" width="30" height="80" fill="#F44336" />
    <rect x="100" y="390" width="30" height="60" fill="#F44336" />
    <rect x="150" y="370" width="30" height="70" fill="#F44336" />
    <rect x="200" y="400" width="30" height="80" fill="#F44336" />
    <rect x="250" y="350" width="30" height="90" fill="#F44336" />
    <rect x="300" y="300" width="30" height="110" fill="#F44336" />
    
    <!-- The Fair Value Gap -->
    <rect x="320" y="180" width="100" height="140" fill="rgba(76, 175, 80, 0.3)" stroke="#4CAF50" stroke-width="2" />
    <text x="370" y="250" fill="#ffffff" font-family="Arial" font-size="20" text-anchor="middle">FVG</text>
    
    <!-- Candles after gap -->
    <rect x="400" y="170" width="30" height="60" fill="#4CAF50" />
    <rect x="450" y="150" width="30" height="70" fill="#4CAF50" />
    <rect x="500" y="180" width="30" height="60" fill="#4CAF50" />
    <rect x="550" y="160" width="30" height="70" fill="#4CAF50" />
    <rect x="600" y="190" width="30" height="60" fill="#4CAF50" />
    <rect x="650" y="170" width="30" height="50" fill="#4CAF50" />
    <rect x="700" y="150" width="30" height="60" fill="#4CAF50" />
  </g>

  <!-- Volume -->
  <g>
    <rect x="300" y="530" width="30" height="50" fill="#F44336" opacity="0.7" />
    <rect x="350" y="530" width="30" height="50" fill="#F44336" opacity="0.7" />
    <rect x="400" y="530" width="30" height="50" fill="#4CAF50" opacity="0.7" />
  </g>
  
  <!-- Arrows -->
  <path d="M 320 330 L 330 300 L 340 330 Z" fill="#F44336" />
  <path d="M 410 200 L 420 170 L 430 200 Z" fill="#4CAF50" transform="rotate(180 420 185)" />
  
  <!-- Title -->
  <text x="400" y="40" fill="#ffffff" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold">Fair Value Gap (FVG)</text>
  
  <!-- Labels -->
  <text x="400" y="570" fill="#ffffff" font-family="Arial" font-size="18" text-anchor="middle">Volume Imbalance</text>
  <text x="250" y="150" fill="#ffffff" font-family="Arial" font-size="18" text-anchor="middle">Bearish</text>
  <text x="550" y="150" fill="#ffffff" font-family="Arial" font-size="18" text-anchor="middle">Bullish</text>
</svg>